<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RoadAssist</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; color: #222; }
        header { background: #111; color: white; padding: 18px; font-size: 22px; font-weight: bold; }
        header span { color: #ff8517; }
        .card { background: white; margin: 18px auto; padding: 20px; max-width: 500px;
                border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); text-align: center; }
        a.btn { display: block; background: #ff8517; color: white; padding: 14px;
                border-radius: 6px; text-decoration: none; font-weight: bold; margin-top: 16px; }
    </style>
</head>
<body>
    <header>Road<span>Assist</span></header>
    <div class="card">
        <h2>Car broke down?</h2>
        <p>Share your location and call a nearby workshop.</p>
        <a class="btn" href="{% url 'request_help' %}">Request Help</a>
    </div>
</body>
</html>
